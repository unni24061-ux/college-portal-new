<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Faculty Portal - Post Announcement</title>


<link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Sen:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background-color: #f9f9f9;
    }

    nav.top-nav {
        width: 100%;
        height: 60px;
        background: #000;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        box-sizing: border-box;
        flex-shrink: 0;
    }

    .logo {
        font-family: 'League Gothic', sans-serif;
        font-size: 28px;
        letter-spacing: 1.5px;
    }

    .app-layout {
        display: flex;
        flex: 1;
        height: calc(100vh - 60px);
        overflow: hidden;
    }

    aside {
        width: 260px;
        background: #fff;
        border-right: 2px solid #000;
        display: flex;
        flex-direction: column;
        padding: 25px;
        box-sizing: border-box;
        overflow-y: auto;
    }

    aside h2 {
        font-family: 'Sen', sans-serif;
        font-size: 18px;
        margin-top: 0;
        margin-bottom: 25px;
        text-align: center;
    }

    aside nav {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    aside a {
        text-decoration: none;
        color: #333;
        font-weight: 600;
        font-size: 14px;
        padding: 10px 12px;
        border-radius: 4px;
        border: 1px solid transparent;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    aside a:hover,
    aside a.active {
        border: 1px solid #000;
        background: #000;
        color: #fff;
    }

    main {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 35px;
        box-sizing: border-box;
        overflow-y: auto;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #000;
        padding-bottom: 20px;
        margin-bottom: 30px;
    }

    header h1 {
        margin: 0;
        font-size: 24px;
        font-family: 'Sen', sans-serif;
    }

    .card {
        border: 2px solid #000;
        padding: 30px;
        border-radius: 8px;
        background: #fff;
        box-sizing: border-box;
        max-width: 800px;
        margin: 0 auto;
        width: 100%;
    }

    .card h3 {
        margin-top: 0;
        font-family: 'Sen', sans-serif;
        margin-bottom: 20px;
        font-size: 20px;
    }

    .form-group {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    label {
        font-size: 13px;
        font-weight: 600;
        color: #333;
    }

    input[type="text"],
    select,
    textarea {
        width: 100%;
        padding: 10px 12px;
        border: 2px solid #000;
        border-radius: 6px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        background: #fff;
        box-sizing: border-box;
        outline: none;
    }

    textarea {
        resize: vertical;
        min-height: 120px;
    }

    .row-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .action-btn {
        padding: 12px 20px;
        background: #000;
        color: #fff;
        border: none;
        cursor: pointer;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        width: 100%;
        margin-top: 10px;
    }

    .action-btn:hover {
        opacity: 0.8;
    }

    .hidden {
        display: none;
    }
</style>


</head>

<body>

<nav class="top-nav">


<div class="logo">
    College portal.
</div>

<div class="welname">
    Hello {{ request.user }}
</div>


</nav>

<div class="app-layout">


<aside>

    <h2>FACULTY PORTAL</h2>

    <nav>

        <a href="{% url 'facu_dash' %}">
            <i class="fa-solid fa-chart-pie"></i>
            Dashboard
        </a>

        <a href="{% url 'facu_profile' %}">
            <i class="fa-solid fa-user"></i>
            My Profile
        </a>

        <a href="{% url 'f_manage' %}">
            <i class="fa-solid fa-users-gear"></i>
            Student Management
        </a>

        <a href="{% url 'announcement' %}" class="active">
            <i class="fa-solid fa-bullhorn"></i>
            Announcements
        </a>

        <a href="{% url 'f_notification' %}">
            <i class="fa-solid fa-bell"></i>
            Notifications
        </a>

        <a href="{% url 'campus_connect' %}">
            <i class="fa-solid fa-network-wired"></i>
            Campus Connect
        </a>

        <a href="">
            <i class="fa-solid fa-file-lines"></i>
            Templates
        </a>

        <a href="{% url 'logout' %}"
           style="margin-top: 20px; color: #d9534f; border-color: #d9534f;">

            <i class="fa-solid fa-right-from-bracket"></i>
            Logout

        </a>

    </nav>

</aside>


<main>

    <header>

        <h1>Post Announcement</h1>

        <span style="font-weight: 600; font-size: 14px;">
            Broadcast Portal
        </span>

    </header>


    <div class="card">

        <h3>Create New Broadcast</h3>

        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label>Announcement Title</label>

                <input
                    type="text"
                    name="title"
                    required
                >

            </div>


            <div class="form-group">

                <label>Target Audience</label>

                <select
                    name="target_audience"
                    id="target_audience"
                    required
                >

                    <option value="all">
                        All Students
                    </option>

                    <option value="department">
                        Particular Department
                    </option>

                    <option value="semester">
                        Particular Semester
                    </option>

                    <option value="specific_student">
                        Particular Student
                    </option>

                </select>

            </div>


            <div class="row-grid">


                <div
                    class="form-group hidden"
                    id="department-group"
                >

                    <label>Department</label>

                    <select name="department">

                        <option value="">
                            Select Department
                        </option>

                        <option value="CSE">CSE</option>
                        <option value="IT">IT</option>
                        <option value="EEE">EEE</option>
                        <option value="EC">EC</option>
                        <option value="MECH">MECH</option>
                        <option value="CIVIL">CIVIL</option>

                    </select>

                </div>


                <div
                    class="form-group hidden"
                    id="semester-group"
                >

                    <label>Semester</label>

                    <select name="semester">

                        <option value="">
                            Select Semester
                        </option>

                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>

                    </select>

                </div>


                <div
                    class="form-group hidden"
                    id="roll-group"
                >

                    <label>Student Roll Number</label>

                    <input
                        type="text"
                        name="roll_no"
                        placeholder="Enter roll number"
                    >

                </div>


            </div>


            <div class="form-group">

                <label>Message Content</label>

                <textarea
                    name="message"
                    placeholder="Type your announcement details here..."
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                class="action-btn"
            >
                Publish Announcement
            </button>

        </form>

    </div>

</main>


</div>

<script>

    const targetAudience =
        document.getElementById("target_audience");

    const departmentGroup =
        document.getElementById("department-group");

    const semesterGroup =
        document.getElementById("semester-group");

    const rollGroup =
        document.getElementById("roll-group");


    function updateFields() {

        departmentGroup.classList.add("hidden");
        semesterGroup.classList.add("hidden");
        rollGroup.classList.add("hidden");


        if (targetAudience.value === "department") {

            departmentGroup.classList.remove("hidden");

        }

        else if (targetAudience.value === "semester") {

            semesterGroup.classList.remove("hidden");

        }

        else if (targetAudience.value === "specific_student") {

            rollGroup.classList.remove("hidden");

        }

    }


    targetAudience.addEventListener(
        "change",
        updateFields
    );

    updateFields();

</script>

</body>
</html>
