<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Pending</title>
    <!-- Importing Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for the Rocket Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
            position: relative;
        }

        .container {
            text-align: center;
            padding: 45px 35px;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #262626;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
            max-width: 440px;
            width: 90%;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(5px);
        }

        /* Rocket & Exhaust Container */
        .rocket-container {
            position: relative;
            height: 140px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Static Rocket */
        .rocket-wrapper {
            position: relative;
            z-index: 2;
            margin-top: 15px;
        }

        .rocket-wrapper i {
            font-size: 46px;
            color: #ffffff;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.8));
            transform: rotate(-45deg);
            display: inline-block;
        }

        /* Glowing Blue Exhaust Stream */
        .exhaust-stream {
            position: absolute;
            top: 62px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 65px;
            background: linear-gradient(to bottom, #38bdf8, rgba(56, 189, 248, 0.1));
            border-radius: 2px;
            box-shadow: 0 0 15px #38bdf8, 0 0 30px #0ea5e9;
            z-index: 1;
            animation: pulseExhaust 1.5s ease-in-out infinite alternate;
        }

        /* Subtle Sparks/Streaks around the top and sides of the rocket */
        .local-spark {
            position: absolute;
            width: 1px;
            height: 14px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.7));
            animation: sparkFall linear infinite;
            z-index: 1;
        }

        /* Top-left of rocket */
        .local-spark:nth-child(1) {
            left: calc(50% - 35px);
            top: 5px;
            animation-duration: 1.3s;
            animation-delay: 0s;
        }

        /* Top-right of rocket */
        .local-spark:nth-child(2) {
            left: calc(50% + 35px);
            top: 2px;
            animation-duration: 1.6s;
            animation-delay: 0.5s;
            height: 10px;
        }

        /* Far left side */
        .local-spark:nth-child(3) {
            left: calc(50% - 48px);
            top: 40px;
            animation-duration: 1.1s;
            animation-delay: 0.2s;
            height: 12px;
        }

        /* Far right side */
        .local-spark:nth-child(4) {
            left: calc(50% + 45px);
            top: 45px;
            animation-duration: 1.4s;
            animation-delay: 0.8s;
            height: 16px;
        }

        @keyframes sparkFall {
            0% {
                transform: translateY(0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(50px);
                opacity: 0;
            }
        }

        @keyframes pulseExhaust {
            0% {
                height: 55px;
                opacity: 0.8;
                box-shadow: 0 0 10px #38bdf8;
            }
            100% {
                height: 70px;
                opacity: 1;
                box-shadow: 0 0 20px #38bdf8, 0 0 35px #0ea5e9;
            }
        }

        /* Text Styling */
        h2 {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: #f3f4f6;
            margin-bottom: 12px;
            margin-top: 5px;
        }

        /* Animated Dots */
        .loading-dots span {
            animation: blink 1.4s infinite both;
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        .loading-dots span:nth-child(4) { animation-delay: 0.6s; }

        @keyframes blink {
            0% { opacity: 0.2; }
            20% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        p {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Return to Login Link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #d1d5db;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 10px 20px;
            border: 1px solid #333333;
            border-radius: 8px;
            background: #121212;
            transition: all 0.3s ease;
        }

        .back-link i {
            font-size: 11px;
            transition: transform 0.3s ease;
        }

        .back-link:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .back-link:hover i {
            transform: translateX(-3px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Rocket, Glowing Blue Exhaust, and Sparks around top & sides -->
        <div class="rocket-container">
            <div class="local-spark"></div>
            <div class="local-spark"></div>
            <div class="local-spark"></div>
            <div class="local-spark"></div>
            
            <div class="rocket-wrapper">
                <i class="fa-solid fa-rocket"></i>
            </div>
            <div class="exhaust-stream"></div>
        </div>

        <!-- Status Message -->
        <h2>
            Faculty verification pending<span class="loading-dots"><span>.</span><span>.</span><span>.</span><span>.</span></span>
        </h2>
        
        <p>Your account is currently under review. You will be notified once approval is complete.</p>

        <!-- Return Link -->
        <a href="{% url 'login_p' %}" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Return to login
        </a>
    </div>

</body>
</html>
